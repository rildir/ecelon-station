name: Release
# Pushing a version tag (v0.2.0) builds the Windows desktop app and attaches it to a GitHub release:
# an installer and a portable exe. The build bundles the runner's Node, so the app needs no Node on the user's PC.
# The exe is not code-signed: Windows SmartScreen shows a warning on first run ("More info" → "Run anyway").
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Bundle Node for the server
        shell: bash
        run: mkdir -p build/node && cp "$(node -p 'process.execPath')" build/node/node.exe
      - run: npm run dist
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "$GITHUB_REF_NAME" --generate-notes
