name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Package installs and starts (npm pack → install → --version / --help)
        shell: bash
        run: |
          npm pack --silent
          mkdir "$RUNNER_TEMP/pkg" && cd "$RUNNER_TEMP/pkg" && npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/ecelon-station-*.tgz
          npx --no-install ecelon-station --version
          npx --no-install ecelon-station --help >/dev/null
